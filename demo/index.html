<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mock Request Error — Chrome Test</title>
    <style>
      body {
        font: 15px/1.5 system-ui, sans-serif;
        max-width: 640px;
        margin: 40px auto;
        padding: 0 16px;
      }
      button {
        padding: 10px 14px;
        font: inherit;
        cursor: pointer;
        margin-right: 8px;
      }
      pre {
        background: #111;
        color: #eee;
        padding: 12px;
        border-radius: 8px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      code {
        background: #eee;
        padding: 1px 4px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Mock Request Error — test page</h1>
    <ol>
      <li>Reload the extension on <code>chrome://extensions</code></li>
      <li><b>Hard-reload this tab</b> (<code>Cmd+Shift+R</code>) after every extension reload</li>
      <li>Close DevTools on this tab</li>
      <li>Popup → status <b>500</b> → <b>Intercept next request</b></li>
      <li>Click <b>Send message</b></li>
    </ol>
    <p>
      <button id="send">Send message</button>
    </p>
    <h2>Result</h2>
    <pre id="out">No request yet.</pre>
    <script>
      document.getElementById("send").onclick = async () => {
        const out = document.getElementById("out");
        out.textContent = "Sending…";
        try {
          const res = await fetch("/api/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: "hello" }),
          });
          const text = await res.text();
          out.textContent =
            "HTTP " +
            res.status +
            "\nX-Mock-Request-Error: " +
            (res.headers.get("X-Mock-Request-Error") || "(none)") +
            "\n\n" +
            text;
        } catch (err) {
          out.textContent = "Network error: " + err.message;
        }
      };
    </script>
  </body>
</html>
